<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘, 세 가지</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #f2edf7; display: flex; justify-content: center; min-height: 100vh; padding: 16px; color: #333; }
    .app-container { width: 100%; max-width: 412px; display: flex; flex-direction: column; gap: 14px; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; }
    .header-title { font-size: 20px; font-weight: 700; color: #111; }
    .card { background-color: #ffffff; border-radius: 24px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .goal-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .goal-label { font-size: 15px; font-weight: 700; }
    .goal-textarea { width: 100%; height: 68px; background-color: #f7f5fa; border: none; border-radius: 14px; padding: 12px; font-size: 14px; outline: none; resize: none; }
    .save-btn { background-color: #e89e5a; color: #fff; border: none; border-radius: 20px; padding: 10px 20px; font-weight: 700; cursor: pointer; }
    .habit-card { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; }
    .habit-left { display: flex; align-items: center; gap: 14px; }
    .badge { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .badge-eng { background: #e4e7f9; color: #7f8bc9; }
    .badge-code { background: #d6f2e4; color: #3e9e73; }
    .badge-fit { background: #fce1e7; color: #e16b8b; }
    .habit-title { font-size: 16px; font-weight: 700; }
    .habit-streak { font-size: 12px; color: #888; }
    .check-btn { width: 38px; height: 38px; border-radius: 50%; border: none; color: #fff; font-size: 18px; cursor: pointer; }
    .check-eng { background: #8c9ee2; }
    .check-code { background: #43a375; }
    .check-fit { background: #e56d8a; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <span style="font-size:20px;">✕</span>
      <h1 class="header-title">오늘, 세 가지</h1>
      <div><span style="font-size:18px; margin-right:10px;">🔍</span><span style="font-size:18px;">↗</span></div>
    </header>

    <div class="card">
      <div class="goal-group">
        <label class="goal-label">올해 목표</label>
        <textarea id="thisYear" class="goal-textarea" placeholder="올해 이루고 싶은 것을 적어보세요"></textarea>
      </div>
      <div class="goal-group">
        <label class="goal-label">내년 목표</label>
        <textarea id="nextYear" class="goal-textarea" placeholder="내년에 이루고 싶은 것을 적어보세요"></textarea>
      </div>
      <button class="save-btn" onclick="saveGoals()">목표 저장</button>
    </div>

    <div class="card habit-card">
      <div class="habit-left">
        <div class="badge badge-eng">영</div>
        <div><div class="habit-title">영어</div><div id="streak-eng" class="habit-streak">1일째 연속</div></div>
      </div>
      <button class="check-btn check-eng" onclick="toggleCheck('eng')">✓</button>
    </div>

    <div class="card habit-card">
      <div class="habit-left">
        <div class="badge badge-code">코</div>
        <div><div class="habit-title">바이브 코딩</div><div id="streak-code" class="habit-streak">1일째 연속</div></div>
      </div>
      <button class="check-btn check-code" onclick="toggleCheck('code')">✓</button>
    </div>

    <div class="card habit-card">
      <div class="habit-left">
        <div class="badge badge-fit">몸</div>
        <div><div class="habit-title">몸관리</div><div id="streak-fit" class="habit-streak">1일째 연속</div></div>
      </div>
      <button class="check-btn check-fit" onclick="toggleCheck('fit')">✓</button>
    </div>
  </div>

  <script>
    // 내 휴대폰 내부 저장소(LocalStorage)에 데이터 저장
    window.onload = function() {
      document.getElementById('thisYear').value = localStorage.getItem('thisYear') || '';
      document.getElementById('nextYear').value = localStorage.getItem('nextYear') || '';
    };

    function saveGoals() {
      localStorage.setItem('thisYear', document.getElementById('thisYear').value);
      localStorage.setItem('nextYear', document.getElementById('nextYear').value);
      alert('휴대폰에 목표가 저장되었습니다!');
    }

    function toggleCheck(type) {
      const el = document.getElementById('streak-' + type);
      let count = parseInt(el.innerText) || 1;
      count++;
      el.innerText = count + "일째 연속";
    }
  </script>
</body>
</html>
